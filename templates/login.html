<!DOCTYPE html>  <html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Handwritten Digit Classification</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(120deg, #2980b9, #6dd5fa);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }  .login-box {
        background: white;
        padding: 30px;
        width: 350px;
        border-radius: 10px;
        box-shadow: 0px 0px 15px rgba(0,0,0,0.2);
        text-align: center;
    }

    h2 {
        color: #2c3e50;
        margin-bottom: 5px;
    }

    p {
        color: #555;
        margin-bottom: 20px;
    }

    input {
        width: 90%;
        padding: 10px;
        margin: 10px 0;
        border: 1px solid #ccc;
        border-radius: 5px;
    }

    button {
        width: 95%;
        padding: 10px;
        background: #2c3e50;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    button:hover {
        background: #1a252f;
    }

    .footer {
        margin-top: 15px;
        font-size: 13px;
        color: #777;
    }

    .footer a {
        color: #2c3e50;
        text-decoration: none;
    }
</style>

</head>
<body>  <div class="login-box">
    <h2>Handwritten Digit Classification</h2>
    <p>Sign in to continue</p>  <form action="/login" method="POST">
    <input type="text" name="username" placeholder="Username" required>
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit">Login</button>
</form>

<div class="footer">
    Don't have an account? <a href="#">Contact Admin</a>
</div>

</div>  </body>
</html>
